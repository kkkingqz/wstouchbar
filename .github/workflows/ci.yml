name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev clang pkg-config
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/logic-fixtures
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          PROPTEST_CASES: '2000'
          PROPTEST_CONTROLS_CASES: '200'

  proptest-long:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev clang pkg-config
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/logic-fixtures
      - run: cargo test --workspace --release --locked
        env:
          PROPTEST_CASES: '100000'
          PROPTEST_CONTROLS_CASES: '10000'

  render:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and Mesa runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev clang pkg-config libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/logic-fixtures
      - run: cargo xtask test-env gpu
      - name: Upload golden image differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff
          path: target/golden-diff/
          if-no-files-found: ignore

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz protocol decoders
        working-directory: fuzz
        run: |
          targets=$(cargo +nightly fuzz list)
          if [ -z "$targets" ]; then
            echo "Decoder targets are introduced in stage 4 H2; none exist yet."
          fi
          for target in $targets; do
            cargo +nightly fuzz run "$target" -- -max_total_time=600
          done
      - name: Upload fuzz crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-fuzz-crashes
          path: fuzz/artifacts/
