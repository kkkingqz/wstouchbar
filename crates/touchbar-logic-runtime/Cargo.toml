[package]
name = "touchbar-logic-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
touchbar-model.workspace = true
touchbar-core.workspace = true
touchbar-logic-types.workspace = true
wasmtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Generated ABI bindings may allow unsafe locally; ordinary code stays denied.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
disallowed_types = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
match_same_arms = "warn"

[dev-dependencies]
touchbar-wasm-fixtures.workspace = true
touchbar-testkit = { path = "../touchbar-testkit" }
proptest.workspace = true
