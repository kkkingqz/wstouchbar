[package]
name = "touchbar-logic-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
touchbar-model.workspace = true
touchbar-logic-types.workspace = true
wit-bindgen.workspace = true
log.workspace = true

# Generated ABI bindings may allow unsafe locally; ordinary code stays denied.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
disallowed_types = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
match_same_arms = "warn"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
touchbar-testkit = { path = "../touchbar-testkit" }
serde_json.workspace = true
proptest.workspace = true

[[example]]
name = "smoke"
crate-type = ["cdylib"]
