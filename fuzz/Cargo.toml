[package]
name = "touchbar-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
[package.metadata]
cargo-fuzz = true
[dependencies]
libfuzzer-sys = "0.4"
touchbar-protocol = { path = "../crates/touchbar-protocol" }
[workspace]
members = ["."]

[[bin]]
name = "session_message"
path = "fuzz_targets/session_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "daemon_message"
path = "fuzz_targets/daemon_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "swapchain"
path = "fuzz_targets/swapchain.rs"
test = false
doc = false
bench = false
